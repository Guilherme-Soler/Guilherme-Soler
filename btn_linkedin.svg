<svg width="320" height="84" viewBox="0 0 320 84" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLinkedin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>

    <radialGradient id="glowLinkedin" cx="15%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scanLinkedin" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.3"/>
      <rect y="2" width="4" height="2" fill="transparent"/>
    </pattern>

    <filter id="crtBlurLinkedin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .txtL  { font-family: 'Courier New', Courier, monospace; fill: #ff2b2b; }
      .headL { font-weight: bold; }
      .dimL  { fill: #ff5555; opacity: 0.85; }
      .flickerL { animation: flickerL 4.2s infinite; }
      @keyframes flickerL {
        0%   { opacity: 1;   }
        4%   { opacity: 0.82;}
        7%   { opacity: 1;   }
        8%   { opacity: 0.6; }
        9%   { opacity: 1;   }
        100% { opacity: 1;   }
      }
      .cursorL { animation: blinkL 1s steps(1) infinite; }
      @keyframes blinkL {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .btnL:hover rect.border { stroke: #ff2b2b; }
    </style>
  </defs>

  <g class="btnL">
    <rect x="0" y="0" width="320" height="84" fill="url(#bgLinkedin)" rx="8"/>
    <rect x="0" y="0" width="320" height="84" fill="url(#glowLinkedin)" rx="8"/>
    <rect class="border" x="3" y="3" width="314" height="78" fill="none" stroke="#440000" stroke-width="3" rx="8"/>

    <g class="flickerL" filter="url(#crtBlurLinkedin)">
      <text x="28" y="36" class="txtL headL" font-size="20" letter-spacing="1">&gt;&gt; LINKEDIN</text>
      <text x="28" y="62" class="txtL dimL" font-size="15" letter-spacing="0.5">in/guilherme-soler-lumiate</text>
    </g>

    <rect class="cursorL" x="266" y="48" width="10" height="16" fill="#ff2b2b"/>

    <g>
      <rect width="320" height="84" fill="url(#scanLinkedin)" rx="8" opacity="0.5"/>
    </g>
  </g>
</svg>
