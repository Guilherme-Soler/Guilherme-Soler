<svg width="320" height="84" viewBox="0 0 320 84" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgEmail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>

    <radialGradient id="glowEmail" cx="15%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scanEmail" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.3"/>
      <rect y="2" width="4" height="2" fill="transparent"/>
    </pattern>

    <filter id="crtBlurEmail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .txtE  { font-family: 'Courier New', Courier, monospace; fill: #ff2b2b; }
      .headE { font-weight: bold; }
      .dimE  { fill: #ff5555; opacity: 0.85; }
      .flickerE { animation: flickerE 3.8s infinite; }
      @keyframes flickerE {
        0%   { opacity: 1;   }
        3%   { opacity: 0.82;}
        6%   { opacity: 1;   }
        7%   { opacity: 0.6; }
        8%   { opacity: 1;   }
        100% { opacity: 1;   }
      }
      .cursorE { animation: blinkE 1s steps(1) infinite; }
      @keyframes blinkE {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .btnE:hover rect.border { stroke: #ff2b2b; }
    </style>
  </defs>

  <g class="btnE">
    <rect x="0" y="0" width="320" height="84" fill="url(#bgEmail)" rx="8"/>
    <rect x="0" y="0" width="320" height="84" fill="url(#glowEmail)" rx="8"/>
    <rect class="border" x="3" y="3" width="314" height="78" fill="none" stroke="#440000" stroke-width="3" rx="8"/>

    <g class="flickerE" filter="url(#crtBlurEmail)">
      <text x="28" y="36" class="txtE headE" font-size="20" letter-spacing="1">&gt;&gt; EMAIL</text>
      <text x="28" y="62" class="txtE dimE" font-size="15" letter-spacing="0.5">solerhguilherme@gmail.com</text>
    </g>

    <rect class="cursorE" x="266" y="48" width="10" height="16" fill="#ff2b2b"/>

    <g>
      <rect width="320" height="84" fill="url(#scanEmail)" rx="8" opacity="0.5"/>
    </g>
  </g>
</svg>
